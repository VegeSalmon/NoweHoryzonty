name: plec

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Ile NOWYCH osób odpytać (0 = wszystkie pozostałe)"
        required: true
        default: "30"

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: wikidata
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          cat > plec.py <<'PYEOF'
          import csv, re, os, time, requests

          # "produkcja" pominięta - to firmy, nie osoby.
          # Z obsady bierzemy tylko DWIE pierwsze osoby: pytanie brzmi
          # "czy w centrum jest bohaterka", a nie "jaka jest płeć całej obsady".
          ROLE_OSOBY = ["reżyseria","scenariusz","zdjęcia","montaż","muzyka",
                        "dźwięk","producent","kostiumy","scenografia",
                        "charakteryzacja","casting"]
          OBSADA_ILE = 2

          API  = "https://www.wikidata.org/w/api.php"
          HEAD = {"User-Agent":"NH26-program-research/2.0 "
                               "(https://github.com/VegeSalmon/NoweHoryzonty)"}
          GUILD = r"\s+(FSF|PSC|ASC|BSC|AFC|SBC|PSM)\b"

          FILMY = {"Q2526255","Q28389","Q222344","Q7042855","Q36834","Q3282637",
                   "Q483501","Q36180","Q639669","Q10800557","Q10798782","Q1053574",
                   "Q33231","Q5716684","Q1281618"}
          PLEC  = {"Q6581097":"M","Q6581072":"K","Q1097630":"NB","Q48270":"NB",
                   "Q1052281":"K","Q2449503":"M"}

          def split(s, ile=None):
              out = []
              for x in re.split(r",| oraz | i (?=[A-ZŻŹĆĄŚĘŁÓŃ])", s or ""):
                  x = re.sub(GUILD, "", x).strip(" ·;")
                  if len(x) > 3 and not re.search(r"\d", x):
                      out.append(x)
                  if ile and len(out) >= ile: break
              return out

          names = set()
          for r in csv.DictReader(open("credits.csv", encoding="utf-8")):
              for role in ROLE_OSOBY:
                  names.update(split(r.get(role,"")))
              names.update(split(r.get("obsada",""), OBSADA_ILE))

          done, existing = set(), []
          if os.path.exists("plec.csv"):
              with open("plec.csv", encoding="utf-8") as fh:
                  rd = csv.reader(fh); next(rd, None)
                  for row in rd:
                      if row and len(row) > 2 and not row[2].startswith("blad"):
                          done.add(row[0]); existing.append(row)
          todo = sorted(names - done)
          lim = int(os.environ.get("LIMIT","30") or 0)
          if lim: todo = todo[:lim]
          print(f"osob lacznie: {len(names)} | zrobione: {len(done)} | teraz: {len(todo)}")

          ses = requests.Session(); ses.headers.update(HEAD)

          def get(params, tries=5):
              wait = 2
              for t in range(tries):
                  try:
                      r = ses.get(API, params=params, timeout=30)
                      if r.status_code == 429 or r.status_code >= 500:
                          raise RuntimeError(f"HTTP {r.status_code}")
                      return r.json()
                  except Exception as e:
                      if t == tries-1: raise
                      print(f"    ponawiam ({e}), czekam {wait}s")
                      time.sleep(wait); wait *= 3
              return {}

          out = open("plec.csv","w",newline="",encoding="utf-8")
          w = csv.writer(out)
          w.writerow(["osoba","qid","opis","plec","filmowiec","pewnosc"])
          for row in existing: w.writerow(row)

          for i, n in enumerate(todo, 1):
              qid = desc = g = ""; film = False; conf = "brak"
              try:
                  hits = get({"action":"wbsearchentities","search":n,"language":"en",
                              "uselang":"en","format":"json","limit":3,
                              "type":"item"}).get("search", [])
                  ids = [h["id"] for h in hits]
                  if ids:
                      ents = get({"action":"wbgetentities","ids":"|".join(ids),
                                  "format":"json","props":"claims|descriptions",
                                  "languages":"en"}).get("entities", {})
                      for qq in ids:
                          e = ents.get(qq, {}); cl = e.get("claims", {})
                          if "P21" not in cl: continue
                          occ = {c["mainsnak"]["datavalue"]["value"]["id"]
                                 for c in cl.get("P106", [])
                                 if c["mainsnak"].get("datavalue")}
                          gq = cl["P21"][0]["mainsnak"]["datavalue"]["value"]["id"]
                          d  = (e.get("descriptions",{}).get("en",{}) or {}).get("value","")
                          if occ & FILMY:
                              qid, desc, g, film, conf = qq, d, PLEC.get(gq,gq), True, "wysoka"
                              break
                          if not qid:
                              qid, desc, g, conf = qq, d, PLEC.get(gq,gq), "niska (zawod nie filmowy)"
              except Exception as e:
                  desc = f"blad: {type(e).__name__}: {e}"
              w.writerow([n, qid, desc, g, "tak" if film else "nie", conf])
              out.flush()
              if i % 25 == 0: print(f"[{i}/{len(todo)}] {n}")
              time.sleep(0.8)
          out.close()
          PYEOF
          python plec.py

      - name: commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plec.csv || true
          git commit -m "plec.csv (+${{ inputs.limit }})" || echo "bez zmian"
          git push || true
